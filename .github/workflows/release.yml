name: Release

# 与 .cnb.yml 的 web_trigger_build_mac / web_trigger_build_windows 对应：
# 手动触发 → 原生平台构建 → 上传腾讯云 COS。
#
# 凭据放在仓库 Settings → Secrets and variables → Actions：
#   TENCENTCLOUD_SECRET_ID / TENCENTCLOUD_SECRET_KEY / COS_BUCKET / COS_REGION
# 工作流文件必须提交在 CNB 仓库：GitHub 侧只是被强制同步的镜像，直接改 GitHub 会被下次同步覆盖。

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 构建平台
        type: choice
        options: [all, macos, windows]
        default: all
      upload:
        description: 构建完成后上传到 COS
        type: boolean
        default: true

permissions:
  contents: read

# 同一分支同一平台不并发，避免两次发布交错上传同一个 Key
concurrency:
  group: release-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 先在便宜的 Linux runner 上跑测试，失败就不浪费 macOS 额度
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: 缓存 bun 包
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: 安装依赖
        run: bun install

      - name: 单元测试
        run: bun run test

  macos:
    name: macOS arm64
    needs: test
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # public/realsgan 走 Git LFS，checkout 默认不会拉取真实文件，不开 lfs 会拿到指针文本
      - uses: actions/checkout@v4
        with:
          lfs: true

      # macos-latest 目前指向 Apple Silicon；若标签漂移则直接失败，避免产出错误架构
      - name: 校验 runner 架构
        run: |
          arch="$(uname -m)"
          if [ "$arch" != "arm64" ]; then
            echo "::error::macOS 任务需要 Apple Silicon runner，当前为 $arch"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # tauri.conf.json 的 beforeBuildCommand 用 pnpm 跑 assets + 前端构建
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装依赖
        run: bun install

      - name: 构建 dmg
        run: bun run app:build --target aarch64-apple-darwin --bundles dmg

      - name: 保存产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: 上传到 COS
        if: inputs.upload
        env:
          SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        # 脚本只接受 macOS arm64，并按 <prefix>/<version>/macos/arm64/ 归档
        run: bun run upload:cos --platform macos --arch arm64

  windows:
    name: Windows x64
    needs: test
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # 推理 exe 与 vcomp140*.dll 同样在 LFS 中，不拉取会把指针文件打进安装包
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装依赖
        run: bun install

      - name: 构建 NSIS 安装包
        run: bun run app:build --bundles nsis

      - name: 保存产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: 上传到 COS
        if: inputs.upload
        env:
          SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        # 架构由脚本从文件名识别（..._x64-setup.exe → x64）
        run: bun run upload:cos --platform windows

# electron 二进制及 electron-builder 依赖下载镜像（避免直连 GitHub 超时）
.electron_mirror: &electron_mirror
  env:
    ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

# 基础环境
.configuration: &configuration
  <<: *electron_mirror
  docker:
    image: docker.cnb.cool/arsrna/dev-image/nodejs
    volumes:
      - /root/.bun/install/cache

.install: &install
  name: install
  script: bun i

.build: &build
  name: build
  script: bun run build

.upload_cos: &upload_cos
  name: 发布更新到 COS
  imports:
    - https://cnb.cool/arsrna/env/-/blob/main/cos.yaml
  script: bun run upload:cos

$:
  vscode:
    - services:
        - vscode
        - docker
      runner:
        cpus: 32
      <<: *configuration
      stages:
        - <<: *install

  push:
    sync:
      runner:
        cpus: 2
      services:
        - docker
      imports:
        - https://cnb.cool/arsrna/env/-/blob/main/git.yaml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/ArSrNa/ArESRGAN-GUI.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            git_email: "root@arsrna.cn"
            force: true

master:
  web_trigger_build_linux:
    - runner:
        cpus: 32
      <<: *configuration
      stages:
        - <<: *install
        - <<: *build
        - <<: *upload_cos

  web_trigger_build_mac:
    - runner:
        namespace: group
        tags:
          - seele-macbook
      <<: *electron_mirror
      stages:
        - <<: *install
        - <<: *build
        - <<: *upload_cos

  web_trigger_build_windows:
    - runner:
        namespace: group
        tags:
          - keqing
      <<: *electron_mirror
      stages:
        - <<: *install
        - <<: *build
        - <<: *upload_cos

# 基础环境
.configuration: &configuration
  docker:
    image: docker.cnb.cool/arsrna/dev-image/go
    volumes:
      - /root/.bun/install/cache

.install: &install
  name: install
  script: bun i

.build: &build
  name: build
  script: bun run app:build

.upload_cos: &upload_cos
  name: 发布更新到 COS
  imports:
    - https://cnb.cool/arsrna/env/-/blob/main/cos.yaml
  script: bun run upload:cos

$:
  vscode:
    - services:
        - vscode
        - docker
      runner:
        cpus: 64
      <<: *configuration
      stages:
        - <<: *install

  web_trigger_build_mac:
    - runner:
        namespace: group
        tags:
          - seele-macbook
      stages:
        - <<: *install
        - name: 检查 Rust 工具链
          script: cargo --version
        - name: 准备 Apple Silicon 编译目标
          script: rustup target add aarch64-apple-darwin
        - <<: *build
          script: bun run app:build --target aarch64-apple-darwin --bundles dmg
        - <<: *upload_cos
          script: bun run upload:cos --platform macos --arch arm64

  web_trigger_build_windows:
    - runner:
        namespace: group
        tags:
          - keqing
      stages:
        - <<: *install
        - name: 检查 Rust 工具链
          script: cargo --version
        - <<: *build
          script: bun run app:build --bundles nsis
        - <<: *upload_cos

"**":
  push:
    sync:
      runner:
        cpus: 2
      services:
        - docker
      imports:
        - https://cnb.cool/arsrna/env/-/blob/main/git.yaml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/ArSrNa/ArESRGAN-GUI.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            git_email: "root@arsrna.cn"
            force: true
